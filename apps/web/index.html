<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Calorie Tracker</title>
    <meta name="description" content="Track meals, set nutrition goals and see how you are doing." />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong one. The stylesheet only has a light and a dark scope, so the
      // OS preference is turned into an explicit value here.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (error) {
          // Private browsing can block storage; fall back to the OS setting.
        }
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
